<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikImo - Live Social Network</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0e14; color: #fff; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 480px; background: #121824; display: flex; flex-direction: column; height: 100vh; position: relative; border-left: 1px solid #1e293b; border-right: 1px solid #1e293b; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #1a2234; border-bottom: 1px solid #28354e; }
        .logo { font-size: 20px; font-weight: bold; background: linear-gradient(45deg, #ff0050, #00f2fe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .admin-badge { background: #ff0050; padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; cursor: pointer; }

        /* Main Screen Views */
        .content-area { flex: 1; overflow-y: auto; padding: 15px; position: relative; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* TikTok Feed Simulation */
        .video-card { background: #1a2234; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #28354e; }
        .user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #ff0050; display: flex; justify-content: center; align-items: center; font-weight: bold; }
        .media-placeholder { width: 100%; height: 250px; background: #000; border-radius: 8px; display: flex; justify-content: center; align-items: center; color: #64748b; font-size: 14px; margin-bottom: 10px; }

        /* Imo Voice Board Simulation */
        .board-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .seat { background: #1a2234; padding: 15px 5px; border-radius: 10px; text-align: center; border: 1px dashed #334155; }
        .seat.active { border-style: solid; border-color: #00f2fe; }

        /* Forms & Inputs */
        input, textarea, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1a2234; color: #fff; margin-top: 8px; }
        button { background: linear-gradient(90deg, #ff0050, #00f2fe); border: none; font-weight: bold; cursor: pointer; }

        /* Bottom Navigation Bar */
        .nav-bar { display: flex; justify-content: space-around; background: #1a2234; padding: 12px 0; border-top: 1px solid #28354e; }
        .nav-item { text-align: center; font-size: 12px; color: #94a3b8; cursor: pointer; }
        .nav-item.active { color: #00f2fe; font-weight: bold; }
        .add-btn { background: linear-gradient(45deg, #ff0050, #00f2fe); border-radius: 50%; width: 35px; height: 35px; display: flex; justify-content: center; align-items: center; font-size: 20px; color: #fff; margin-top: -5px; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="logo">TikImo Live</div>
            <div class="admin-badge" onclick="toggleAdminPanel()">Admin Access</div>
        </div>

        /* Content Views */
        <div class="content-area">
            
            <!-- Home: Video Feed -->
            <div id="home" class="tab-content active">
                <h3>🔥 ট্রেন্ডিং ভিডিও</h3>
                <div id="feedList">
                    <div class="video-card">
                        <div class="user-info">
                            <div class="avatar">P</div>
                            <div><strong>প্রীতম বস</strong><br><small style="color:#94a3b8">২ মিনিট আগে</small></div>
                        </div>
                        <p style="margin-bottom:8px">স্বাগতম আমার নতুন সামাজিক অ্যাপে! সবাই কেমন আছেন?</p>
                        <div class="media-placeholder">🎥 লাইভ শর্ট ভিডিও কন্টেন্ট</div>
                        <div style="display:flex; gap:15px; font-size:14px; color:#94a3b8;">
                            <span>❤️ ১৪২</span> <span>💬 ৩৮</span> <span>⭐ ২৫ স্টার</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Imo Voice Board -->
            <div id="board" class="tab-content">
                <h3>🎙️ আড্ডা বোর্ড ও চ্যানেল</h3>

                <div class="board-grid">
                    <div class="seat active"><div class="avatar" style="margin:0 auto 5px;">P</div><small>হোস্ট</small></div>
